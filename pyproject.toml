[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opioid-conversion-rotation-engine"
version = "2.0.0"
description = "OpioidRotate Sentinel: Equianalgesic Conversion & Incomplete Cross-Tolerance Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
opioid-conversion-rotation-engine = "opioid_conversion_rotation_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/opioid-conversion-rotation-agent"
Repository = "https://github.com/abusuraihsakhri/opioid-conversion-rotation-agent.git"

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["agents*", "opioid_conversion_rotation_agent*"]
