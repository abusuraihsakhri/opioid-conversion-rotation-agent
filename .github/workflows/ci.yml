name: Test Python package and browser calculator

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
          python -m pip check
      - name: Python syntax and tests
        env:
          AUDIT_SECRET_KEY: ci-only-test-secret-for-automation
        run: |
          python -m compileall -q agents opioid_conversion_rotation_agent opioid_rotate.py enrichment.py
          python -m pytest -q
      - name: Browser JavaScript syntax and tests
        run: |
          node --check web/app.js
          node --test tests/web-mme.test.cjs
      - name: Browser asset existence
        run: |
          test -s index.html
          test -s web/index.html
          test -s web/app.js
          grep -q 'src="./app.js"' web/index.html
